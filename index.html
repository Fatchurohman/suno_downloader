<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno AI MP3 Downloader</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151e2e;
      --input: #0d131f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --green: #10b981;
      --blue: #3b82f6;
      --red: #ef4444;
      --purple: #8b5cf6;
      --border: #2e3c54;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    h1 {
      font-size: 1.2rem;
      color: var(--amber);
      margin-bottom: 0.35rem;
    }
    h2 {
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    p.desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 0.85rem;
      resize: vertical;
    }
    textarea:focus {
      border-color: var(--amber);
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .btn {
      width: 100%;
      background: var(--amber);
      color: #090d16;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-green {
      background: var(--green);
      color: #ffffff;
    }
    .btn-purple {
      background: var(--purple);
      color: #ffffff;
    }
    .status {
      display: none;
      margin-top: 0.75rem;
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
    }
    .status.info {
      display: block;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--blue);
      color: #93c5fd;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--green);
      color: #6ee7b7;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: #fca5a5;
    }
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .song-item {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .song-head {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }
    .song-head img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--border);
    }
    .song-meta {
      overflow: hidden;
      flex: 1;
    }
    .song-title {
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-uuid {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    audio {
      width: 100%;
      height: 36px;
    }
    .code-box {
      background: var(--input);
      border: 1px solid var(--border);
      padding: 0.65rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.74rem;
      color: #fde68a;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
      margin-bottom: 0.65rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="panel">
      <h1>Suno Multi-Song Scanner (Bulk MP3)</h1>
      <p class="desc">Mendukung tautan panjang (suno.com/song/...), tautan pendek (suno.com/s/...), maupun kode UUID langsung.</p>

      <label for="bulkInput">Tautan Lagu Suno:</label>
      <textarea id="bulkInput" placeholder="Tempel link lagu Suno di sini...&#10;Contoh: https://suno.com/song/29fb7873-64dc-4f62-a889-c48d5ed71fc1?sh=ONQbaNknyxxj6zHD"></textarea>

      <div class="btn-row">
        <button type="button" id="sampleBulkBtn" class="btn btn-secondary">Isi Contoh</button>
        <button type="button" id="scanBulkBtn" class="btn">Scan Lagu</button>
      </div>

      <div id="statusBox" class="status"></div>
      <div id="songListContainer" class="song-list"></div>
    </section>

    <section class="panel">
      <h2>Script Ekstraktor Otomatis (Bookmarklet)</h2>
      <p class="desc">Jalankan di tab Library akun Suno kamu untuk mengekstrak seluruh track sekaligus.</p>
      <div id="bookmarkletCode" class="code-box"></div>
      <button type="button" id="copyScriptBtn" class="btn btn-purple">Salin Script Bookmarklet</button>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bulkInput = document.getElementById('bulkInput');
      const sampleBulkBtn = document.getElementById('sampleBulkBtn');
      const scanBulkBtn = document.getElementById('scanBulkBtn');
      const statusBox = document.getElementById('statusBox');
      const songListContainer = document.getElementById('songListContainer');
      const bookmarkletCode = document.getElementById('bookmarkletCode');
      const copyScriptBtn = document.getElementById('copyScriptBtn');

      const BOOKMARKLET_RAW = `javascript:(async function(){try{const text=document.body.innerText+' '+Array.from(document.querySelectorAll('a[href*="/song/"]')).map(a=>a.href).join(' ');const matches=text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi)||[];const ids=[...new Set(matches.map(x=>x.toLowerCase()))];if(!ids.length){alert('Tidak ditemukan track Suno. Buka halaman Library Suno, scroll ke bawah, lalu jalankan lagi.');return;}const existing=document.getElementById('suno-dl-box');if(existing)existing.remove();const box=document.createElement('div');box.id='suno-dl-box';box.style.cssText='position:fixed;inset:15px;background:#090d16;color:#f8fafc;z-index:9999999;padding:16px;border-radius:12px;border:2px solid #f59e0b;overflow-y:auto;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,0.8);';box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h3 style="color:#f59e0b;margin:0;font-size:16px;">Suno Downloader ('+ids.length+' Lagu)</h3><button onclick="document.getElementById(\\'suno-dl-box\\').remove()" style="background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">Tutup</button></div><div id="suno-item-list" style="display:flex;flex-direction:column;gap:8px;">Sedang memuat lagu...</div>';document.body.appendChild(box);const list=document.getElementById('suno-item-list');list.innerHTML='';for(let i=0;i<ids.length;i++){const id=ids[i];let audioUrl='https://cdn1.suno.ai/'+id+'.mp3';let trackTitle='Lagu #'+(i+1)+' ('+id.slice(0,8)+')';try{const res=await fetch('/api/clip/'+id);if(res.ok){const data=await res.json();if(data&&typeof data==='object'&&data.audio_url){audioUrl=data.audio_url;if(data.title)trackTitle=data.title;}}}catch(_){}const row=document.createElement('div');row.style.cssText='background:#151e2e;padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2e3c54;';row.innerHTML='<div style="overflow:hidden;margin-right:10px;"><div style="font-weight:bold;font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;">'+trackTitle+'</div><div style="font-size:11px;color:#94a3b8;font-family:monospace;">'+id.slice(0,8)+'</div></div><a href="'+audioUrl+'" target="_blank" download="'+trackTitle.replace(/[^a-zA-Z0-9]/g,'_')+'.mp3" style="background:#10b981;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;white-space:nowrap;">Download MP3</a>';list.appendChild(row);}}catch(e){alert('Gagal mengekstrak: '+e.message);}})();`;

      bookmarkletCode.textContent = BOOKMARKLET_RAW;

      const setStatus = (msg, type = 'info') => {
        if (!msg) {
          statusBox.className = 'status';
          statusBox.textContent = '';
          return;
        }
        statusBox.textContent = msg;
        statusBox.className = `status ${type}`;
      };

      const extractUuidsFromText = (text) => {
        if (typeof text !== 'string' || !text.trim()) return [];
        const matches = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi);
        if (!matches) return [];
        return [...new Set(matches.map((id) => id.toLowerCase()))];
      };

      const extractShortlinks = (text) => {
        if (typeof text !== 'string' || !text.trim()) return [];
        const regex = /https?:\/\/suno\.com\/s\/([a-zA-Z0-9]+)/gi;
        const links = [];
        let m;
        while ((m = regex.exec(text)) !== null) {
          links.push(m[0]);
        }
        return [...new Set(links)];
      };

      const resolveShortlinkToUuid = async (shortUrl) => {
        try {
          const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`;
          const res = await fetch(proxy);
          if (!res.ok) return null;
          const data = await res.json();
          if (!data || typeof data.contents !== 'string') return null;

          const found = extractUuidsFromText(data.contents);
          return found.length > 0 ? found[0] : null;
        } catch (_) {
          return null;
        }
      };

      // Validasi ketat respon audio untuk mencegah pengunduhan file JSON/XML error
      const downloadAudioFile = async (uuid, filename) => {
        const primaryCdn = `https://cdn1.suno.ai/${uuid}.mp3`;
        const secondaryCdn = `https://cdn2.suno.ai/${uuid}.mp3`;

        const proxyUrls = [
          `https://corsproxy.io/?url=${encodeURIComponent(primaryCdn)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(primaryCdn)}`,
          `https://corsproxy.io/?url=${encodeURIComponent(secondaryCdn)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(secondaryCdn)}`
        ];

        let validBlob = null;

        for (const url of proxyUrls) {
          try {
            const res = await fetch(url);
            if (!res.ok) continue;

            const contentType = (res.headers.get('content-type') || '').toLowerCase();
            
            // Tolak jika bukan berkas binary/audio
            if (contentType.includes('json') || contentType.includes('xml') || contentType.includes('html') || contentType.includes('text')) {
              continue;
            }

            const blob = await res.blob();

            // Berkas MP3 Suno memiliki ukuran lebih dari 100 KB; respon error berukuran < 10 KB
            if (blob.size < 50000) {
              const snippet = await blob.slice(0, 300).text();
              if (snippet.includes('{') || snippet.includes('<') || snippet.includes('detail') || snippet.includes('Not Found')) {
                continue;
              }
            }

            validBlob = blob;
            break;
          } catch (_) {
            // Lanjut ke jalur proxy berikutnya
          }
        }

        if (validBlob) {
          const blobUrl = URL.createObjectURL(validBlob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
          return true;
        }

        // Jalur Fallback: Buka pemutar browser langsung jika proxy terhalang CORS
        window.open(primaryCdn, '_blank', 'noopener,noreferrer');
        return false;
      };

      const renderSongList = (uuidList) => {
        songListContainer.innerHTML = '';

        uuidList.forEach((uuid, index) => {
          const mp3Url = `https://cdn1.suno.ai/${uuid}.mp3`;
          const coverUrl = `https://cdn2.suno.ai/image_${uuid}.jpeg`;
          const shortId = uuid.slice(0, 8);

          const item = document.createElement('div');
          item.className = 'song-item';
          item.innerHTML = `
            <div class="song-head">
              <img src="${coverUrl}" alt="Cover" onerror="this.style.display='none'">
              <div class="song-meta">
                <div class="song-title">Suno Track #${index + 1} (${shortId})</div>
                <div class="song-uuid">ID: ${uuid}</div>
              </div>
            </div>
            <audio controls preload="none">
              <source src="${mp3Url}" type="audio/mpeg">
              <source src="https://cdn2.suno.ai/${uuid}.mp3" type="audio/mpeg">
              Browser tidak mendukung pemutar audio ini.
            </audio>
            <div class="btn-row">
              <button type="button" class="btn btn-green dl-trigger" data-uuid="${uuid}" data-name="suno-${shortId}.mp3">
                Download MP3
              </button>
              <a href="${mp3Url}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                Buka Tab Baru
              </a>
            </div>
          `;
          songListContainer.appendChild(item);
        });

        songListContainer.querySelectorAll('.dl-trigger').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const uuid = btn.getAttribute('data-uuid');
            const name = btn.getAttribute('data-name');
            if (!uuid) return;

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Memverifikasi Audio...';

            try {
              const success = await downloadAudioFile(uuid, name);
              if (success) {
                btn.textContent = 'Berhasil Diunduh!';
                setTimeout(() => {
                  btn.textContent = originalText;
                  btn.disabled = false;
                }, 2000);
              } else {
                setStatus('Proteksi CORS mendeteksi request eksternal. Audio telah dibuka di tab baru pemutar browser.', 'info');
                btn.textContent = originalText;
                btn.disabled = false;
              }
            } catch (err) {
              setStatus(`Terjadi kegagalan proses: ${err.message}`, 'error');
              btn.textContent = originalText;
              btn.disabled = false;
            }
          });
        });
      };

      scanBulkBtn.addEventListener('click', async () => {
        const text = bulkInput.value || '';
        let detectedUuids = extractUuidsFromText(text);
        const shortlinks = extractShortlinks(text);

        if (detectedUuids.length === 0 && shortlinks.length === 0) {
          songListContainer.innerHTML = '';
          setStatus('Tautan tidak valid. Tempel link suno.com/song/... atau kode UUID lagu.', 'error');
          return;
        }

        scanBulkBtn.disabled = true;

        if (shortlinks.length > 0) {
          setStatus(`Mengurai ${shortlinks.length} tautan pendek Suno...`, 'info');
          const resolvedPromises = shortlinks.map((link) => resolveShortlinkToUuid(link));
          const resolvedResults = await Promise.all(resolvedPromises);
          
          resolvedResults.forEach((id) => {
            if (id) detectedUuids.push(id);
          });
          detectedUuids = [...new Set(detectedUuids)];
        }

        scanBulkBtn.disabled = false;

        if (detectedUuids.length === 0) {
          songListContainer.innerHTML = '';
          setStatus('Gagal mengurai tautan pendek. Buka tautan di peramban lalu salin URL utuh lagu.', 'error');
          return;
        }

        renderSongList(detectedUuids);
        setStatus(`Berhasil mendeteksi ${detectedUuids.length} lagu Suno siap unduh!`, 'success');
      });

      sampleBulkBtn.addEventListener('click', () => {
        bulkInput.value = [
          'https://suno.com/song/d3632e1f-95a4-4f25-8353-042c7c8122f9',
          'https://suno.com/song/29fb7873-64dc-4f62-a889-c48d5ed71fc1?sh=ONQbaNknyxxj6zHD'
        ].join('\n');
        scanBulkBtn.click();
      });

      copyScriptBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(BOOKMARKLET_RAW);
          copyScriptBtn.textContent = 'Script Berhasil Disalin!';
          setTimeout(() => {
            copyScriptBtn.textContent = 'Salin Script Bookmarklet';
          }, 2000);
        } catch (_) {
          setStatus('Silakan salin teks di dalam kotak skrip secara manual.', 'info');
        }
      });
    });
  </script>
</body>
</html>
