<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno MP3 Downloader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --input: #090d16;
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .app {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 1.25rem;
    }
    h1 { font-size: 1.2rem; color: var(--amber); margin-bottom: 0.3rem; }
    p.sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
    .field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.85rem; }
    label { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    input {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    input:focus { border-color: var(--amber); }
    .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .chip {
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: var(--amber);
      color: #090d16;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: var(--green); color: #fff; margin-top: 0.5rem; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.5rem;
      font-size: 0.82rem;
    }
    .status {
      display: none;
      margin-top: 0.85rem;
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 0.82rem;
      word-break: break-word;
    }
    .status.info { display: block; background: rgba(245,158,11,0.15); border: 1px solid var(--amber); color: #fde68a; }
    .status.success { display: block; background: rgba(16,185,129,0.15); border: 1px solid var(--green); color: #6ee7b7; }
    .status.error { display: block; background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: #fca5a5; }
    .result {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 0.75rem;
    }
    .result.active { display: flex; }
    .meta-box {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: var(--input);
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .cover { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--border); }
    .meta-text { overflow: hidden; flex: 1; }
    .title { font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cdn-box {
      background: var(--input);
      border: 1px solid var(--border);
      padding: 0.6rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #93c5fd;
      word-break: break-all;
    }
    audio { width: 100%; height: 40px; }
  </style>
</head>
<body>

  <main class="app">
    <h1>Suno AI MP3 & CDN Grabber</h1>
    <p class="sub">Tempel link lagu Suno AI untuk mengambil link CDN dan mengunduh MP3 durasi penuh.</p>

    <form id="sunoForm" novalidate>
      <div class="field">
        <label for="urlInput">Link Lagu Suno / UUID</label>
        <input type="text" id="urlInput" value="https://suno.com/song/d3632e1f-95a4-4f25-8353-042c7c8122f9" required>
      </div>

      <div class="chips">
        <button type="button" class="chip" data-url="https://suno.com/song/d3632e1f-95a4-4f25-8353-042c7c8122f9">Sampel Suno #1</button>
        <button type="button" class="chip" data-url="https://suno.com/song/6f4c4902-8f61-4250-98a4-43c65cf28024">Sampel Suno #2</button>
      </div>

      <button type="submit" id="submitBtn" class="btn">Ambil Link CDN & MP3</button>
    </form>

    <div id="statusBox" class="status"></div>

    <section id="resultBox" class="result">
      <div class="meta-box">
        <img id="coverImg" class="cover" src="" alt="Cover">
        <div class="meta-text">
          <div id="songTitle" class="title">-</div>
          <div id="songUuid" style="font-size:0.74rem; color:var(--muted);">-</div>
        </div>
      </div>

      <audio id="player" controls preload="metadata"></audio>

      <div>
        <label>Direct Link CDN MP3:</label>
        <div id="cdnMp3Text" class="cdn-box" style="margin-top:0.3rem;">-</div>
      </div>

      <button type="button" id="downloadBtn" class="btn btn-green">Download File MP3 Penuh</button>
      <a id="openTabBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline">Buka MP3 di Tab Baru</a>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('sunoForm');
      const urlInput = document.getElementById('urlInput');
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');
      const resultBox = document.getElementById('resultBox');
      const coverImg = document.getElementById('coverImg');
      const songTitle = document.getElementById('songTitle');
      const songUuid = document.getElementById('songUuid');
      const player = document.getElementById('player');
      const cdnMp3Text = document.getElementById('cdnMp3Text');
      const downloadBtn = document.getElementById('downloadBtn');
      const openTabBtn = document.getElementById('openTabBtn');
      const chips = document.querySelectorAll('.chip');

      let activeMp3Url = '';
      let activeFileName = 'suno-audio.mp3';

      const setStatus = (msg, type = 'info') => {
        statusBox.textContent = msg;
        statusBox.className = `status ${type}`;
      };

      const findUuid = (str) => {
        if (typeof str !== 'string') return null;
        const m = str.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        return m ? m[0].toLowerCase() : null;
      };

      const resolveShortLink = async (url) => {
        try {
          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
          if (!res.ok) return null;
          const raw = await res.text();
          const json = JSON.parse(raw);
          if (!json || typeof json.contents !== 'string') return null;
          return findUuid(json.contents);
        } catch (_) {
          return null;
        }
      };

      const processSuno = async (inputStr) => {
        resultBox.classList.remove('active');
        player.pause();
        submitBtn.disabled = true;
        setStatus('Mengekstrak kode UUID & merakit link CDN Suno...', 'info');

        try {
          let uuid = findUuid(inputStr);

          if (!uuid && inputStr.startsWith('http')) {
            setStatus('Membaca Short-Link Suno via Proxy...', 'info');
            uuid = await resolveShortLink(inputStr);
          }

          if (!uuid) {
            throw new Error('Kode UUID tidak ditemukan. Pastikan link berasal dari Suno AI.');
          }

          const mp3Url = `https://cdn1.suno.ai/${uuid}.mp3`;
          const imgUrl = `https://cdn2.suno.ai/image_${uuid}.jpeg`;

          activeMp3Url = mp3Url;
          activeFileName = `suno-${uuid.slice(0, 8)}.mp3`;

          coverImg.src = imgUrl;
          songTitle.textContent = `Suno Track (${uuid.slice(0, 8)})`;
          songUuid.textContent = `UUID: ${uuid}`;
          cdnMp3Text.textContent = mp3Url;
          player.src = mp3Url;
          openTabBtn.href = mp3Url;

          resultBox.classList.add('active');
          setStatus('Berhasil! Link CDN MP3 ditemukan dan siap diunduh.', 'success');
        } catch (err) {
          setStatus(err.message || 'Gagal memproses link.', 'error');
        } finally {
          submitBtn.disabled = false;
        }
      };

      downloadBtn.addEventListener('click', async () => {
        if (!activeMp3Url) return;
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'Mengunduh MP3...';

        try {
          const res = await fetch(activeMp3Url);
          if (!res.ok) throw new Error('CORS Fallback');
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);

          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = activeFileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          setTimeout(() => URL.revokeObjectURL(blobUrl), 8000);
          setStatus(`File "${activeFileName}" berhasil diunduh!`, 'success');
        } catch (_) {
          window.open(activeMp3Url, '_blank', 'noopener,noreferrer');
          setStatus('File MP3 dibuka di tab baru. Klik titik tiga pada player untuk menyimpan.', 'info');
        } finally {
          downloadBtn.disabled = false;
          downloadBtn.textContent = 'Download File MP3 Penuh';
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = urlInput.value.trim();
        if (val) processSuno(val);
      });

      chips.forEach((c) => {
        c.addEventListener('click', () => {
          const u = c.getAttribute('data-url');
          if (u) {
            urlInput.value = u;
            processSuno(u);
          }
        });
      });
    });
  </script>
</body>
</html>
